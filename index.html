
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>G63 NIGHT DRIVE</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#05070d;color:white;font-family:Arial;overflow:hidden}
#game{height:100dvh;width:100%;position:relative}
canvas{display:block}
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#080e1cdd;padding:12px 16px;border:1px solid #ffffff25;border-radius:10px}
.small{font-size:10px;letter-spacing:2px;color:#91a7c5}
.value{font-size:22px;font-weight:bold;margin-top:5px}
.logo{position:absolute;top:85px;width:100%;text-align:center;letter-spacing:5px;font-weight:900;text-shadow:0 0 15px #00bfff;pointer-events:none}
.controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;gap:10px}
.controls button{width:65px;height:60px;border-radius:12px;background:#07182cdd;border:1px solid #00cfff;color:white;font-size:23px;touch-action:none}
.controls .action{font-size:12px;color:#00eaff}
.overlay{position:absolute;inset:0;background:#030712ed;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;padding:25px}
h1{font-size:34px;letter-spacing:3px;color:#00dfff;text-shadow:0 0 25px #008cff}
p{color:#a5b4ca;margin-top:14px;font-size:13px}
.start{margin-top:30px;padding:16px 42px;background:#062743;border:1px solid #00dfff;color:#00eaff;border-radius:8px;font-weight:bold}
#status{position:absolute;bottom:100px;width:100%;text-align:center;color:#ffcf66;font-size:12px;padding:0 15px}
</style>
</head>
<body>
<div id="game">
<div class="hud">
 <div class="panel"><div class="small">VELOCITY</div><div class="value"><span id="speed">0</span> KM/H</div></div>
 <div class="panel"><div class="small">DISTANCE</div><div class="value"><span id="distance">0</span> M</div></div>
</div>

<div class="logo">MERCEDES-AMG G63</div>
<div id="status">Загрузка игры...</div>

<div class="controls">
 <button id="left">◀</button>
 <button class="action" id="brake">BRAKE</button>
 <button class="action" id="gas">GAS ▲</button>
 <button id="right">▶</button>
</div>

<div class="overlay" id="menu">
 <h1>G63 NIGHT DRIVE</h1>
 <p>2020 MERCEDES-BENZ G-CLASS AMG</p>
 <p>Реальная 3D-модель автомобиля</p>
 <p>WASD / стрелки — управление</p>
 <button class="start" id="start">НАЧАТЬ ПОЕЗДКУ</button>
</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import JSZip from "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";

const status=document.getElementById("status");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d1a);
scene.fog=new THREE.Fog(0x080d1a,45,190);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,4,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.getElementById("game").prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc0d9ff,0x171923,2));

const moon=new THREE.DirectionalLight(0xffffff,2.5);
moon.position.set(-15,30,20);
moon.castShadow=true;
scene.add(moon);

const roadMat=new THREE.MeshStandardMaterial({
 color:0x242a33,roughness:.8
});

function makeBox(w,h,d,mat,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

// Ground
makeBox(300,.3,400,
 new THREE.MeshStandardMaterial({color:0x101722}),
 0,-.35,-150);

// Road
makeBox(15,.1,400,roadMat,0,-.12,-150);

// Road markings
const lineMat=new THREE.MeshBasicMaterial({color:0xdce5ee});
const roadLines=[];
for(let z=15;z>-380;z-=12){
 const line=makeBox(.12,.025,5,lineMat,0,-.045,z);
 roadLines.push(line);
}

// Road borders
const edgeMat=new THREE.MeshStandardMaterial({
 color:0x00bfff,
 emissive:0x0077ff,
 emissiveIntensity:2
});
makeBox(.12,.2,400,edgeMat,-7.5,.02,-150);
makeBox(.12,.2,400,edgeMat,7.5,.02,-150);

// Buildings
const buildings=[];
for(let i=0;i<65;i++){
 const side=i%2===0?-1:1;
 const z=-Math.random()*370+10;
 const h=10+Math.random()*28;
 const w=5+Math.random()*10;

 const material=new THREE.MeshStandardMaterial({
  color:0x172238,
  roughness:.9
 });

 const b=makeBox(w,h,9,material,
 side*(13+Math.random()*14),h/2,z);

 buildings.push(b);

 // Windows
 const windowMat=new THREE.MeshBasicMaterial({color:0xffc66a});
 for(let y=3;y<h-2;y+=3){
  for(let x=-w/2+1;x<w/2-1;x+=2){
   if(Math.random()>.5){
    const win=new THREE.Mesh(
     new THREE.PlaneGeometry(.8,1.1),
     windowMat
    );
    win.position.set(b.position.x+x,y,z+4.53);
    scene.add(win);
   }
  }
 }
}

// Street lights
for(let z=10;z>-370;z-=24){
 for(const side of [-1,1]){
  const x=side*8.5;
  const poleMat=new THREE.MeshStandardMaterial({color:0x414b59});
  makeBox(.13,6,.13,poleMat,x,3,z);
  makeBox(1.4,.12,.15,poleMat,x-side*.55,6,z);

  const light=new THREE.PointLight(0xffd59b,25,17);
  light.position.set(x-side*.55,5.7,z);
  scene.add(light);
 }
}

// Vehicle
const car=new THREE.Group();
scene.add(car);

let carReady=false;
let modelObject=null;

function fallback(){
 const group=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({
  color:0x080b11,metalness:.8,roughness:.2
 });
 const glassMat=new THREE.MeshStandardMaterial({
  color:0x071522,metalness:.5,roughness:.15
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,1.65,4.2),bodyMat
 );
 body.position.y=1.25;
 group.add(body);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(2.05,1.15,2.2),glassMat
 );
 cabin.position.set(0,2.55,0);
 group.add(cabin);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,.15,2.3),bodyMat
 );
 roof.position.set(0,3.2,0);
 group.add(roof);

 return group;
}

// Automatic ZIP model loader
async function loadG63(){
 try{
  status.textContent="Открываю архив G63...";

  const response=await fetch(
   "2020-mercedes-benz-g-class-amg-g63.zip"
  );

  if(!response.ok){
   throw new Error("ZIP-файл не найден");
  }

  const buffer=await response.arrayBuffer();
  const zip=await JSZip.loadAsync(buffer);

  const files=Object.keys(zip.files);
  const modelFile=files.find(f=>
   f.toLowerCase().endsWith(".glb") &&
   !zip.files[f].dir
  );

  if(!modelFile){
   throw new Error("В ZIP не найден файл GLB. Проверь содержимое архива.");
  }

  status.textContent="Загружаю Mercedes G63 3D...";

  const modelData=await zip.files[modelFile].async("arraybuffer");

  const loader=new GLTFLoader();

  loader.parse(modelData,"",gltf=>{
   modelObject=gltf.scene;

   modelObject.traverse(obj=>{
    if(obj.isMesh){
     obj.castShadow=true;
     obj.receiveShadow=true;
     if(obj.material){
      obj.material.side=THREE.DoubleSide;
     }
    }
   });

   // Automatic model sizing
   let bounds=new THREE.Box3().setFromObject(modelObject);
   const size=bounds.getSize(new THREE.Vector3());

   const targetLength=4.5;
   const scale=targetLength/Math.max(size.x,size.y,size.z);

   modelObject.scale.setScalar(scale);

   bounds.setFromObject(modelObject);
   const center=bounds.getCenter(new THREE.Vector3());

   modelObject.position.sub(center);
   modelObject.position.y+=bounds.getSize(new THREE.Vector3()).y/2;

   car.add(modelObject);
   carReady=true;

   status.textContent="Mercedes G63 загружен!";
   setTimeout(()=>status.style.display="none",3500);

  },error=>{
   throw new Error("Ошибка чтения 3D-модели");
  });

 }catch(error){
  console.error(error);
  status.textContent=error.message+
  " — используется демонстрационная машина.";

  car.add(fallback());
  carReady=true;
 }
}

loadG63();

// Headlights
for(const x of [-.8,.8]){
 const light=new THREE.SpotLight(0xe6f3ff,120,65,.35,.5,1);
 light.position.set(x,1.4,1.5);
 light.target.position.set(x,.2,-35);
 car.add(light);
 car.add(light.target);
}

// Controls
const keys={};
let speed=0;
let distance=0;
let steering=0;
let playing=false;

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function bind(id,key){
 const el=document.getElementById(id);

 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  el.setPointerCapture(e.pointerId);
 });

 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}

bind("left","a");
bind("right","d");
bind("gas","w");
bind("brake","s");

document.getElementById("start").onclick=()=>{
 playing=true;
 document.getElementById("menu").style.display="none";
};

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  if(keys.w)speed+=45*dt;
  else speed-=10*dt;

  if(keys.s)speed-=80*dt;

  speed=THREE.MathUtils.clamp(speed,0,240);

  if(keys.a)steering+=2*dt;
  if(keys.d)steering-=2*dt;
  if(!keys.a&&!keys.d)steering*=.9;

  car.position.x+=steering*speed*.009*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-5.5,5.5);

  car.rotation.y=THREE.MathUtils.lerp(
   car.rotation.y,-steering*.12,.1
  );

  distance+=speed*dt/3.6;

  document.getElementById("speed").textContent=Math.round(speed);
  document.getElementById("distance").textContent=Math.floor(distance);

  const movement=speed*dt/3.6;

  roadLines.forEach(line=>{
   line.position.z+=movement;
   if(line.position.z>15)line.position.z-=390;
  });

  buildings.forEach(b=>{
   b.position.z+=movement;
   if(b.position.z>20)b.position.z-=390;
  });
 }

 // Follow camera
 const cameraTarget=new THREE.Vector3(
  car.position.x*.4,4.3,10
 );

 camera.position.lerp(cameraTarget,.055);
 camera.lookAt(car.position.x*.35,1.3,-10);

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
