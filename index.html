
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>G63 NIGHT DRIVE</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-user-select:none;
 user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#05070d;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
#game{
 position:relative;
 width:100%;
 height:100dvh;
 overflow:hidden;
 touch-action:none;
}
canvas{display:block}
.hud{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between;
 z-index:2;
 pointer-events:none;
}
.panel{
 background:#080e1cdd;
 border:1px solid #ffffff25;
 border-radius:10px;
 padding:10px 13px;
}
.small{
 color:#91a7c5;
 font-size:9px;
 letter-spacing:2px;
}
.value{
 font-size:20px;
 font-weight:bold;
 margin-top:4px;
}
.logo{
 position:absolute;
 top:85px;
 width:100%;
 text-align:center;
 font-size:13px;
 font-weight:bold;
 letter-spacing:4px;
 color:#dceeff;
 text-shadow:0 0 15px #00bfff;
 pointer-events:none;
}
.controls{
 position:absolute;
 bottom:20px;
 left:0;
 right:0;
 padding:0 13px;
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 z-index:4;
 pointer-events:none;
}
.steering,.pedals{
 display:flex;
 gap:9px;
}
.pedals{flex-direction:column}
.control{
 width:65px;
 height:65px;
 border-radius:17px;
 background:#081a30ed;
 border:1px solid #00bfff;
 color:white;
 font-size:25px;
 font-weight:bold;
 touch-action:none;
 pointer-events:auto;
}
.control.pedal{
 width:72px;
 height:57px;
 font-size:12px;
}
.gas{
 color:#00ffc0;
 border-color:#00e5a0;
 background:#063b30ed;
}
.brake{
 color:#ff7777;
 border-color:#ff5252;
 background:#421515ed;
}
.control.active{
 transform:scale(.93);
 background:#12618b;
}
.gas.active{background:#087d5d}
.brake.active{background:#8b2424}
.overlay{
 position:absolute;
 inset:0;
 z-index:5;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
 background:#030712ed;
}
h1{
 font-size:30px;
 letter-spacing:3px;
 color:#00dfff;
 text-shadow:0 0 25px #008cff;
}
p{
 color:#a5b4ca;
 margin-top:12px;
 font-size:13px;
}
.start{
 margin-top:24px;
 padding:15px 35px;
 background:#062743;
 border:1px solid #00dfff;
 border-radius:8px;
 color:#00eaff;
 font-weight:bold;
}
#status{
 position:absolute;
 z-index:3;
 bottom:105px;
 width:100%;
 text-align:center;
 font-size:12px;
 color:#ffcf66;
 pointer-events:none;
}
#progress{
 position:absolute;
 z-index:3;
 bottom:88px;
 left:15%;
 width:70%;
 height:4px;
 background:#253247;
 display:none;
}
#bar{
 height:100%;
 width:0;
 background:#00dfff;
}
.colors{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:12px;
 margin-top:22px;
 max-width:300px;
}
.color-choice{
 width:38px;
 height:38px;
 border-radius:50%;
 border:3px solid #64748b;
 box-shadow:0 0 8px #000;
 touch-action:manipulation;
}
.color-choice.selected{
 border-color:#00eaff;
 box-shadow:0 0 14px #00bfff;
}
#colorName{
 color:#00dfff;
 font-size:12px;
 margin-top:10px;
}
@media(max-width:380px){
 .control{width:58px;height:58px}
 .control.pedal{width:65px;height:53px}
}
</style>
</head>

<body>
<div id="game">

<div class="hud">
 <div class="panel">
  <div class="small">VELOCITY</div>
  <div class="value"><span id="speed">0</span> KM/H</div>
 </div>
 <div class="panel">
  <div class="small">DISTANCE</div>
  <div class="value"><span id="distance">0</span> M</div>
 </div>
</div>

<div class="logo">MERCEDES-AMG G63</div>

<div id="status">Загрузка Mercedes G63...</div>
<div id="progress"><div id="bar"></div></div>

<div class="controls">
 <div class="steering">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="pedals">
  <button class="control pedal brake" id="brake">ТОРМОЗ</button>
  <button class="control pedal gas" id="gas">ГАЗ ▲</button>
 </div>
</div>

<div class="overlay" id="menu">
 <h1>G63 NIGHT DRIVE</h1>
 <p>2020 MERCEDES-BENZ AMG G63</p>
 <p>Выбери цвет своего Гелика</p>

 <div class="colors">
  <button class="color-choice selected" data-color="#111111" data-name="Чёрный" style="background:#111"></button>
  <button class="color-choice" data-color="#eeeeee" data-name="Белый" style="background:#eee"></button>
  <button class="color-choice" data-color="#777777" data-name="Серый" style="background:#777"></button>
  <button class="color-choice" data-color="#a31320" data-name="Красный" style="background:#a31320"></button>
  <button class="color-choice" data-color="#123b79" data-name="Синий" style="background:#123b79"></button>
 </div>

 <div id="colorName">Чёрный G63</div>

 <p>Управление кнопками на экране</p>
 <button class="start" id="start">НАЧАТЬ ПОЕЗДКУ</button>
</div>

</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import JSZip from "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";

const $=id=>document.getElementById(id);
const status=$("status");

// ЗАПРЕТ СИСТЕМНОГО МЕНЮ
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

// THREE.JS
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d1a);
scene.fog=new THREE.Fog(0x080d1a,45,160);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,400
);
camera.position.set(0,4,10);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.shadowMap.enabled=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$("game").prepend(renderer.domElement);

// ОСВЕЩЕНИЕ
scene.add(new THREE.HemisphereLight(0xc0d9ff,0x171923,2));

const moon=new THREE.DirectionalLight(0xffffff,1.7);
moon.position.set(-15,30,20);
scene.add(moon);

// СОЗДАНИЕ ОБЪЕКТОВ
function box(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

// ЗЕМЛЯ И ДОРОГА
box(300,.3,400,
 new THREE.MeshStandardMaterial({color:0x101722}),
 0,-.35,-150
);

box(15,.1,400,
 new THREE.MeshStandardMaterial({color:0x242a33}),
 0,-.12,-150
);

// РАЗМЕТКА
const roadLines=[];
const lineMat=new THREE.MeshBasicMaterial({color:0xdce5ee});

for(let z=15;z>-380;z-=15){
 roadLines.push(box(.12,.025,5,lineMat,0,-.045,z));
}

// КРАЯ ДОРОГИ
const edgeMat=new THREE.MeshBasicMaterial({color:0x087eb0});
box(.12,.15,400,edgeMat,-7.5,.02,-150);
box(.12,.15,400,edgeMat,7.5,.02,-150);

// ГОРОД — ОБЛЕГЧЁННЫЙ
const buildings=[];

for(let i=0;i<30;i++){
 const side=i%2===0?-1:1;
 const z=-Math.random()*370+10;
 const h=12+Math.random()*22;
 const w=6+Math.random()*8;

 const b=box(
  w,h,9,
  new THREE.MeshStandardMaterial({
   color:0x172238,
   roughness:1
  }),
  side*(14+Math.random()*12),
  h/2,z
 );

 buildings.push(b);
}

// НЕБОЛЬШИЕ СВЕТЯЩИЕСЯ ОКНА
for(let i=0;i<45;i++){
 const side=i%2===0?-1:1;
 const z=-Math.random()*350;
 const x=side*(14+Math.random()*12);
 const y=4+Math.random()*17;

 const windowMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(1,1.4),
  new THREE.MeshBasicMaterial({
   color:Math.random()>.5?0xffc66a:0x70bfff
  })
 );

 windowMesh.position.set(x,y,z);
 windowMesh.rotation.y=side===1?0:Math.PI;
 scene.add(windowMesh);
}

// АВТОМОБИЛЬ
const car=new THREE.Group();
scene.add(car);

let carReady=false;
let modelObject=null;
let paintMaterials=[];
let originalColors=[];

// ЗАГРУЗКА ТВОЕГО АРХИВА
async function loadG63(){
 const filename="2020-mercedes-benz-g-class-amg-g63.zip";

 status.textContent="Загрузка архива G63...";
 $("progress").style.display="block";

 try{
  const response=await fetch(filename);
  if(!response.ok)throw new Error("Архив не найден: "+filename);

  const total=Number(response.headers.get("content-length"))||0;
  const reader=response.body.getReader();
  const chunks=[];
  let loaded=0;

  while(true){
   const {done,value}=await reader.read();
   if(done)break;

   chunks.push(value);
   loaded+=value.length;

   if(total){
    const percent=Math.round(loaded/total*100);
    $("bar").style.width=percent+"%";
    status.textContent="Загрузка модели: "+percent+"%";
   }else{
    status.textContent="Загрузка: "+(loaded/1048576).toFixed(1)+" МБ";
   }
  }

  const buffer=new Uint8Array(loaded);
  let offset=0;

  for(const chunk of chunks){
   buffer.set(chunk,offset);
   offset+=chunk.length;
  }

  status.textContent="Распаковка архива...";
  const zip=await JSZip.loadAsync(buffer);

  const files=Object.keys(zip.files);

  const modelFile=
   files.find(f=>!zip.files[f].dir&&f.toLowerCase().endsWith(".glb"))
   ||files.find(f=>!zip.files[f].dir&&f.toLowerCase().endsWith(".gltf"));

  if(!modelFile)throw new Error("В архиве не найдена 3D-модель");

  if(modelFile.toLowerCase().endsWith(".gltf")){
   throw new Error("Найдена GLTF-модель. Для неё нужна загрузка внешних текстур.");
  }

  status.textContent="Создание автомобиля...";
  const modelData=await zip.files[modelFile].async("arraybuffer");

  const loader=new GLTFLoader();

  loader.parse(
   modelData,
   "",
   gltf=>addModel(gltf),
   error=>modelError(error)
  );

 }catch(error){
  console.error(error);
  status.textContent="Ошибка загрузки: "+error.message;
  $("progress").style.display="none";
 }
}

// СОЗДАНИЕ ГЕЛИКА
function addModel(gltf){
 modelObject=gltf.scene;

 modelObject.traverse(obj=>{
  if(!obj.isMesh)return;

  obj.castShadow=false;
  obj.receiveShadow=false;

  const materials=Array.isArray(obj.material)
   ?obj.material
   :[obj.material];

  materials.forEach(mat=>{
   if(!mat)return;

   const name=(mat.name||"").toLowerCase();

   const excluded=[
    "glass","window","tire","tyre","rubber",
    "wheel","chrome","light","lamp","glass"
   ];

   const isExcluded=excluded.some(word=>name.includes(word));

   if(!isExcluded&&mat.color){
    const copy=mat.clone();
    obj.material=Array.isArray(obj.material)
     ?obj.material.map(m=>m===mat?copy:m)
     :copy;

    paintMaterials.push(copy);
    originalColors.push(copy.color.clone());
   }
  });
 });

 const bounds=new THREE.Box3().setFromObject(modelObject);
 const size=bounds.getSize(new THREE.Vector3());
 const maxDimension=Math.max(size.x,size.y,size.z);
 const scale=4.5/maxDimension;

 modelObject.scale.setScalar(scale);

 const newBounds=new THREE.Box3().setFromObject(modelObject);
 const center=newBounds.getCenter(new THREE.Vector3());

 modelObject.position.x-=center.x;
 modelObject.position.z-=center.z;
 modelObject.position.y-=newBounds.min.y;

 // ГЕЛИК ПЕРЕДОМ ВПЕРЁД
 modelObject.rotation.y=Math.PI;

 car.add(modelObject);
 carReady=true;

 $("progress").style.display="none";
 $("bar").style.width="0%";
 status.textContent="Mercedes G63 готов!";

 setTimeout(()=>status.style.display="none",2500);
}

function modelError(error){
 console.error(error);
 status.textContent="Ошибка загрузки 3D-модели";
 $("progress").style.display="none";
}

// ВЫБОР ЦВЕТА
function changeColor(hex,name){
 const color=new THREE.Color(hex);

 paintMaterials.forEach((mat,index)=>{
  const original=originalColors[index];
  mat.color.copy(original).multiply(color);
 });

 $("colorName").textContent=name+" G63";

 document.querySelectorAll(".color-choice").forEach(btn=>{
  btn.classList.toggle(
   "selected",
   btn.dataset.color===hex
  );
 });
}

document.querySelectorAll(".color-choice").forEach(btn=>{
 btn.addEventListener("click",()=>{
  changeColor(btn.dataset.color,btn.dataset.name);
 });
});

// УПРАВЛЕНИЕ
const keys={};
let speed=0;
let distance=0;
let steering=0;
let playing=false;

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")keys.s=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.code==="Space")keys.s=false;
});

// КНОПКИ С УДЕРЖАНИЕМ
function bind(id,key){
 const el=$(id);

 el.addEventListener("contextmenu",e=>e.preventDefault());

 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  el.classList.add("active");

  try{el.setPointerCapture(e.pointerId)}catch(err){}
 });

 function release(){
  keys[key]=false;
  el.classList.remove("active");
 }

 el.addEventListener("pointerup",release);
 el.addEventListener("pointercancel",release);
 el.addEventListener("lostpointercapture",release);
}

bind("left","a");
bind("right","d");
bind("gas","w");
bind("brake","s");

// СТАРТ
$("start").addEventListener("click",()=>{
 if(!carReady){
  status.style.display="block";
  status.textContent="Подожди загрузки Гелика";
  return;
 }

 playing=true;
 $("menu").style.display="none";
});

// ИГРОВОЙ ЦИКЛ
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(playing){

  // ГАЗ И ТОРМОЗ
  if(keys.w)speed+=35*dt;
  else speed-=7*dt;

  if(keys.s)speed-=65*dt;

  speed=THREE.MathUtils.clamp(speed,0,200);

  // РУЛЬ — ИСПРАВЛЕНО
  if(keys.a)steering-=2.2*dt;
  if(keys.d)steering+=2.2*dt;

  if(!keys.a&&!keys.d){
   steering*=Math.pow(.08,dt);
  }

  steering=THREE.MathUtils.clamp(steering,-1,1);

  // ЛЕВО — ВЛЕВО, ПРАВО — ВПРАВО
  const turnPower=speed/200;

  car.position.x+=steering*turnPower*8*dt;
  car.position.x=THREE.MathUtils.clamp(
   car.position.x,-5.5,5.5
  );

  car.rotation.y=THREE.MathUtils.lerp(
   car.rotation.y,-steering*.18,.12
  );

  distance+=speed*dt/3.6;

  $("speed").textContent=Math.round(speed);
  $("distance").textContent=Math.floor(distance);

  const movement=speed*dt/3.6;

  roadLines.forEach(line=>{
   line.position.z+=movement;
   if(line.position.z>15)line.position.z-=390;
  });

  buildings.forEach(b=>{
   b.position.z+=movement;
   if(b.position.z>20)b.position.z-=390;
  });
 }

 // КАМЕРА
 camera.position.lerp(
  new THREE.Vector3(car.position.x*.4,4.2,10),
  .07
 );

 camera.lookAt(car.position.x*.35,1.3,-10);

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

loadG63();
animate();
</script>
</body>
</html>
