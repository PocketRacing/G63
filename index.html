
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>G63 NIGHT DRIVE</title>

<style>
* {
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-user-select:none;
 user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}

html,body {
 width:100%;
 height:100%;
 overflow:hidden;
 background:#05070d;
 color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
 overscroll-behavior:none;
}

#game {
 position:relative;
 width:100%;
 height:100dvh;
 overflow:hidden;
 touch-action:none;
}

canvas {
 display:block;
 width:100%;
 height:100%;
 touch-action:none;
}

.hud {
 position:absolute;
 top:14px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between;
 pointer-events:none;
 z-index:2;
}

.panel {
 background:#080e1cdd;
 padding:10px 14px;
 border:1px solid #ffffff25;
 border-radius:10px;
}

.small {
 font-size:9px;
 letter-spacing:2px;
 color:#91a7c5;
}

.value {
 font-size:21px;
 font-weight:bold;
 margin-top:4px;
}

.logo {
 position:absolute;
 top:85px;
 width:100%;
 text-align:center;
 letter-spacing:4px;
 font-size:13px;
 font-weight:900;
 color:#dceeff;
 text-shadow:0 0 15px #00bfff;
 pointer-events:none;
}

.controls {
 position:absolute;
 bottom:20px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 padding:0 15px;
 z-index:4;
 pointer-events:none;
}

.steering {
 display:flex;
 gap:10px;
}

.pedals {
 display:flex;
 flex-direction:column;
 gap:10px;
}

.control {
 display:flex;
 align-items:center;
 justify-content:center;
 width:68px;
 height:68px;
 border-radius:17px;
 background:#081a30e8;
 border:1px solid #00bfff;
 color:white;
 font-size:25px;
 font-weight:bold;
 box-shadow:0 0 15px #0077ff22;
 touch-action:none;
 pointer-events:auto;
}

.control.pedal {
 width:76px;
 height:60px;
 font-size:13px;
 letter-spacing:1px;
}

.control.gas {
 background:#063b30e8;
 border-color:#00e5a0;
 color:#00ffc0;
}

.control.brake {
 background:#421515e8;
 border-color:#ff5252;
 color:#ff7777;
}

.control.active {
 transform:scale(.94);
 background:#12618b;
 box-shadow:0 0 20px #00bfff88;
}

.control.gas.active {
 background:#087d5d;
}

.control.brake.active {
 background:#8b2424;
}

.overlay {
 position:absolute;
 inset:0;
 background:#030712ed;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 z-index:5;
 padding:25px;
}

h1 {
 font-size:32px;
 letter-spacing:3px;
 color:#00dfff;
 text-shadow:0 0 25px #008cff;
}

p {
 color:#a5b4ca;
 margin-top:14px;
 font-size:13px;
}

.start {
 margin-top:30px;
 padding:16px 42px;
 background:#062743;
 border:1px solid #00dfff;
 color:#00eaff;
 border-radius:8px;
 font-weight:bold;
 font-size:14px;
}

#status {
 position:absolute;
 bottom:105px;
 width:100%;
 text-align:center;
 color:#ffcf66;
 font-size:12px;
 padding:0 15px;
 z-index:2;
 pointer-events:none;
}

#progress {
 position:absolute;
 bottom:88px;
 left:15%;
 width:70%;
 height:4px;
 background:#253247;
 border-radius:10px;
 overflow:hidden;
 z-index:2;
 display:none;
}

#bar {
 height:100%;
 width:0;
 background:#00dfff;
}

@media(max-width:400px) {
 .control {width:60px;height:60px}
 .control.pedal {width:68px;height:55px}
 .controls {padding:0 10px}
}
</style>
</head>

<body>
<div id="game">

<div class="hud">
 <div class="panel">
  <div class="small">VELOCITY</div>
  <div class="value"><span id="speed">0</span> KM/H</div>
 </div>
 <div class="panel">
  <div class="small">DISTANCE</div>
  <div class="value"><span id="distance">0</span> M</div>
 </div>
</div>

<div class="logo">MERCEDES-AMG G63</div>

<div id="status">Подготовка...</div>
<div id="progress"><div id="bar"></div></div>

<div class="controls">

 <div class="steering">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>

 <div class="pedals">
  <button class="control pedal brake" id="brake">ТОРМОЗ</button>
  <button class="control pedal gas" id="gas">ГАЗ ▲</button>
 </div>

</div>

<div class="overlay" id="menu">
 <h1>G63 NIGHT DRIVE</h1>
 <p>2020 MERCEDES-BENZ AMG G63</p>
 <p>Управление: кнопки на экране</p>
 <button class="start" id="start">НАЧАТЬ ПОЕЗДКУ</button>
</div>

</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import JSZip from "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";

const $=id=>document.getElementById(id);
const status=$("status");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d1a);
scene.fog=new THREE.Fog(0x080d1a,45,190);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,500
);
camera.position.set(0,4,10);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
$("game").prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc0d9ff,0x171923,2));

const moon=new THREE.DirectionalLight(0xffffff,2.5);
moon.position.set(-15,30,20);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
scene.add(moon);

function box(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

// ДОРОГА
box(300,.3,400,
 new THREE.MeshStandardMaterial({color:0x101722}),
 0,-.35,-150
);

box(15,.1,400,
 new THREE.MeshStandardMaterial({color:0x242a33}),
 0,-.12,-150
);

const roadLines=[];
const lineMat=new THREE.MeshBasicMaterial({color:0xdce5ee});

for(let z=15;z>-380;z-=12){
 roadLines.push(box(.12,.025,5,lineMat,0,-.045,z));
}

const edgeMat=new THREE.MeshStandardMaterial({
 color:0x00bfff,
 emissive:0x0077ff,
 emissiveIntensity:2
});

box(.12,.2,400,edgeMat,-7.5,.02,-150);
box(.12,.2,400,edgeMat,7.5,.02,-150);

// ГОРОД
const buildings=[];

for(let i=0;i<55;i++){
 const side=i%2===0?-1:1;
 const z=-Math.random()*370+10;
 const h=10+Math.random()*28;
 const w=5+Math.random()*10;

 const b=box(
  w,h,9,
  new THREE.MeshStandardMaterial({color:0x172238}),
  side*(13+Math.random()*14),
  h/2,z
 );

 buildings.push(b);

 for(let y=3;y<h-2;y+=3){
  for(let x=-w/2+1;x<w/2-1;x+=2){
   if(Math.random()>.5){
    const win=new THREE.Mesh(
     new THREE.PlaneGeometry(.8,1.1),
     new THREE.MeshBasicMaterial({
      color:Math.random()>.5?0xffc66a:0x70bfff
     })
    );
    win.position.set(b.position.x+x,y,z+4.53);
    scene.add(win);
   }
  }
 }
}

// ФОНАРИ
for(let z=10;z>-370;z-=24){
 for(const side of [-1,1]){
  const x=side*8.5;
  const poleMat=new THREE.MeshStandardMaterial({color:0x414b59});

  box(.13,6,.13,poleMat,x,3,z);
  box(1.4,.12,.15,poleMat,x-side*.55,6,z);

  const light=new THREE.PointLight(0xffd59b,20,17);
  light.position.set(x-side*.55,5.7,z);
  scene.add(light);
 }
}

// АВТОМОБИЛЬ
const car=new THREE.Group();
scene.add(car);

let carReady=false;
let modelObject=null;

// ЗАГРУЗКА ZIP
async function loadG63(){
 const filename="2020-mercedes-benz-g-class-amg-g63.zip";
 const loader=new GLTFLoader();

 status.textContent="Загрузка архива Mercedes G63...";
 $("progress").style.display="block";

 try{
  const response=await fetch(filename);
  if(!response.ok)throw new Error("Не найден файл "+filename);

  const total=Number(response.headers.get("content-length"))||0;
  const reader=response.body.getReader();
  const chunks=[];
  let loaded=0;

  while(true){
   const {done,value}=await reader.read();
   if(done)break;

   chunks.push(value);
   loaded+=value.length;

   if(total){
    const percent=Math.round(loaded/total*100);
    $("bar").style.width=percent+"%";
    status.textContent="Загрузка архива: "+percent+"%";
   }else{
    status.textContent="Загрузка: "+
     (loaded/1024/1024).toFixed(1)+" МБ";
   }
  }

  const buffer=new Uint8Array(loaded);
  let offset=0;

  for(const chunk of chunks){
   buffer.set(chunk,offset);
   offset+=chunk.length;
  }

  status.textContent="Распаковка модели...";
  const zip=await JSZip.loadAsync(buffer);

  const files=Object.keys(zip.files);

  const modelFile=
   files.find(f=>!zip.files[f].dir&&f.toLowerCase().endsWith(".glb"))
   ||files.find(f=>!zip.files[f].dir&&f.toLowerCase().endsWith(".gltf"));

  if(!modelFile)throw new Error("В ZIP не найдена GLB/GLTF модель");

  if(modelFile.toLowerCase().endsWith(".gltf")){
   throw new Error("Найдена GLTF-модель. Для её текстур нужна отдельная настройка.");
  }

  status.textContent="Загрузка 3D-модели...";
  const modelData=await zip.files[modelFile].async("arraybuffer");

  loader.parse(
   modelData,
   "",
   gltf=>addModel(gltf),
   error=>modelError(error)
  );

 }catch(error){
  console.error(error);
  status.textContent="Ошибка: "+error.message;
  $("progress").style.display="none";
 }
}

// ДОБАВЛЕНИЕ МОДЕЛИ
function addModel(gltf){
 modelObject=gltf.scene;

 modelObject.traverse(obj=>{
  if(obj.isMesh){
   obj.castShadow=true;
   obj.receiveShadow=true;
   if(obj.material)obj.material.side=THREE.DoubleSide;
  }
 });

 const bounds=new THREE.Box3().setFromObject(modelObject);
 const size=bounds.getSize(new THREE.Vector3());
 const maxDimension=Math.max(size.x,size.y,size.z);
 const scale=4.5/maxDimension;

 modelObject.scale.setScalar(scale);

 const newBounds=new THREE.Box3().setFromObject(modelObject);
 const center=newBounds.getCenter(new THREE.Vector3());

 modelObject.position.x-=center.x;
 modelObject.position.z-=center.z;
 modelObject.position.y-=newBounds.min.y;

 // РАЗВОРОТ ГЕЛИКА ПЕРЕДОМ ВПЕРЁД
 modelObject.rotation.y=Math.PI;

 car.add(modelObject);
 carReady=true;

 $("progress").style.display="none";
 $("bar").style.width="0%";
 status.textContent="Mercedes G63 готов!";

 setTimeout(()=>{
  status.style.display="none";
 },3000);
}

function modelError(error){
 console.error(error);
 status.textContent="Ошибка загрузки 3D-модели";
 $("progress").style.display="none";
}

// ФАРЫ
for(const x of [-.8,.8]){
 const light=new THREE.SpotLight(
  0xe6f3ff,120,65,.35,.5,1
 );

 light.position.set(x,1.4,1.5);
 light.target.position.set(x,.2,-35);

 car.add(light);
 car.add(light.target);
}

// УПРАВЛЕНИЕ
const keys={};
let speed=0;
let distance=0;
let steering=0;
let playing=false;

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")keys.w=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.code==="Space")keys.w=false;
});

// УДЕРЖАНИЕ КНОПОК БЕЗ ВЫЗОВА МЕНЮ КОПИРОВАНИЯ
function bind(id,key){
 const el=$(id);

 el.addEventListener("contextmenu",e=>e.preventDefault());

 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  el.classList.add("active");
  el.setPointerCapture(e.pointerId);
 });

 function release(e){
  keys[key]=false;
  el.classList.remove("active");
 }

 el.addEventListener("pointerup",release);
 el.addEventListener("pointercancel",release);
 el.addEventListener("lostpointercapture",release);
}

bind("left","a");
bind("right","d");
bind("gas","w");
bind("brake","s");

$("start").addEventListener("click",()=>{
 if(!carReady){
  status.textContent="Дождись загрузки автомобиля";
  return;
 }

 playing=true;
 $("menu").style.display="none";
});

// ИГРОВОЙ ЦИКЛ
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(playing){

  if(keys.w)speed+=45*dt;
  else speed-=10*dt;

  if(keys.s)speed-=80*dt;

  speed=THREE.MathUtils.clamp(speed,0,240);

  if(keys.a)steering+=2*dt;
  if(keys.d)steering-=2*dt;

  if(!keys.a&&!keys.d)steering*=.9;

  car.position.x+=steering*speed*.009*dt;
  car.position.x=THREE.MathUtils.clamp(
   car.position.x,-5.5,5.5
  );

  car.rotation.y=THREE.MathUtils.lerp(
   car.rotation.y,-steering*.12,.1
  );

  distance+=speed*dt/3.6;

  $("speed").textContent=Math.round(speed);
  $("distance").textContent=Math.floor(distance);

  const movement=speed*dt/3.6;

  roadLines.forEach(line=>{
   line.position.z+=movement;
   if(line.position.z>15)line.position.z-=390;
  });

  buildings.forEach(b=>{
   b.position.z+=movement;
   if(b.position.z>20)b.position.z-=390;
  });
 }

 camera.position.lerp(
  new THREE.Vector3(car.position.x*.4,4.3,10),
  .055
 );

 camera.lookAt(car.position.x*.35,1.3,-10);

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

loadG63();
animate();
</script>
</body>
</html>
