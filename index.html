
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>G63 NIGHT DRIVE</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#05070d;color:white;font-family:Arial;overflow:hidden}
#game{height:100dvh;width:100%;position:relative}
canvas{display:block}
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#080e1cce;padding:12px 17px;border:1px solid #ffffff25;border-radius:10px}
.small{font-size:10px;letter-spacing:2px;color:#91a7c5}
.value{font-size:23px;font-weight:bold;margin-top:5px}
.logo{position:absolute;top:85px;width:100%;text-align:center;letter-spacing:5px;font-weight:900;text-shadow:0 0 15px #00bfff}
.controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px}
.controls button{width:65px;height:60px;border-radius:12px;background:#07182cdd;border:1px solid #00cfff;color:white;font-size:26px;touch-action:none}
.controls .gas{font-size:13px;color:#00eaff}
.overlay{position:absolute;inset:0;background:#030712ed;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;padding:25px}
h1{font-size:35px;letter-spacing:4px;color:#00dfff;text-shadow:0 0 25px #008cff}
p{color:#a5b4ca;margin-top:14px;font-size:13px}
.start{margin-top:30px;padding:16px 42px;background:#062743;border:1px solid #00dfff;color:#00eaff;border-radius:8px;font-weight:bold}
#status{position:absolute;bottom:100px;width:100%;text-align:center;color:#ffcf66;font-size:12px}
</style>
</head>
<body>
<div id="game">
<div class="hud">
 <div class="panel"><div class="small">VELOCITY</div><div class="value"><span id="speed">0</span> KM/H</div></div>
 <div class="panel"><div class="small">DISTANCE</div><div class="value"><span id="distance">0</span> M</div></div>
</div>
<div class="logo">MERCEDES-AMG G63</div>
<div id="status">Загрузка 3D-модели...</div>

<div class="controls">
 <button id="left">◀</button>
 <button class="gas" id="brake">BRAKE</button>
 <button class="gas" id="gas">GAS ▲</button>
 <button id="right">▶</button>
</div>

<div class="overlay" id="menu">
 <h1>G63 NIGHT DRIVE</h1>
 <p>Mercedes-AMG G63</p>
 <p>Ночной город. Свободная дорога.</p>
 <p>WASD / стрелки — управление</p>
 <button class="start" onclick="startGame()">НАЧАТЬ ПОЕЗДКУ</button>
</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d1a);
scene.fog=new THREE.Fog(0x080d1a,35,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,5,11);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById("game").prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bbcff,0x171923,2));

const moon=new THREE.DirectionalLight(0x9dbbff,2);
moon.position.set(-20,35,20);
moon.castShadow=true;
scene.add(moon);

const roadMat=new THREE.MeshStandardMaterial({
 color:0x252a33,roughness:.82
});
const groundMat=new THREE.MeshStandardMaterial({color:0x101722});

function box(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

// Ground
box(300,.2,300,groundMat,0,-.3,-100);

// Road
box(15,.12,300,roadMat,0,-.12,-100);

// Road markings
const lineMat=new THREE.MeshBasicMaterial({color:0xe1e5e9});
for(let z=20;z>-260;z-=12){
 box(.13,.03,5,lineMat,0,-.035,z);
}

// Road borders
const edgeMat=new THREE.MeshStandardMaterial({
 color:0x00aaff,emissive:0x0066ff,emissiveIntensity:1.5
});
box(.13,.25,300,edgeMat,-7.5,.05,-100);
box(.13,.25,300,edgeMat,7.5,.05,-100);

// City buildings
const buildings=[];
for(let i=0;i<65;i++){
 const side=i%2===0?-1:1;
 const z=-Math.random()*260+20;
 const h=8+Math.random()*30;
 const w=5+Math.random()*9;
 const mat=new THREE.MeshStandardMaterial({
  color:new THREE.Color().setHSL(.59,.3,.09+Math.random()*.08),
  roughness:.9
 });
 const b=box(w,h,8,mat,side*(12+Math.random()*14),h/2,z);
 buildings.push(b);

 // Windows
 const winMat=new THREE.MeshBasicMaterial({color:0xffc66a});
 for(let y=3;y<h-2;y+=3){
  for(let x=-w/2+1;x<w/2-1;x+=2){
   if(Math.random()>.45){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.2),winMat);
    win.position.set(b.position.x+x,y,z+4.02);
    scene.add(win);
   }
  }
 }
}

// Street lights
for(let z=15;z>-250;z-=22){
 for(const side of [-1,1]){
  const x=side*8.5;
  const poleMat=new THREE.MeshStandardMaterial({color:0x353c48});
  box(.15,6,.15,poleMat,x,3,z);
  box(1.5,.12,.2,poleMat,x-side*.6,6,z);
  const light=new THREE.PointLight(0xffd59b,35,18,2);
  light.position.set(x-side*.6,5.8,z);
  scene.add(light);
 }
}

// G63 model
let car;
let carLoaded=false;

function fallbackCar(){
 const group=new THREE.Group();

 const black=new THREE.MeshStandardMaterial({
  color:0x080b11,metalness:.8,roughness:.22
 });
 const glass=new THREE.MeshStandardMaterial({
  color:0x071522,metalness:.6,roughness:.12
 });
 const chrome=new THREE.MeshStandardMaterial({
  color:0x89939c,metalness:.9,roughness:.2
 });

 const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.55,4.1),black);
 body.position.y=1.3;
 group.add(body);

 const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.05,1.1,2.15),glass);
 cabin.position.set(0,2.5,.1);
 group.add(cabin);

 const roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,.15,2.3),black);
 roof.position.set(0,3.1,.1);
 group.add(roof);

 for(const x of [-1,1]){
  for(const z of [-1.35,1.35]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.52,.52,.3,32),
    new THREE.MeshStandardMaterial({color:0x08090b,roughness:.8})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x*1.12,.65,z);
   group.add(wheel);
   const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(.29,.29,.32,16),
    chrome
   );
   rim.rotation.z=Math.PI/2;
   rim.position.copy(wheel.position);
   group.add(rim);
  }
 }
 return group;
}

car=new THREE.Group();
scene.add(car);
car.position.set(0,0,0);

const loader=new GLTFLoader();
loader.load("g63.glb",gltf=>{
 const model=gltf.scene;
 model.scale.setScalar(1);
 model.position.set(0,0,0);
 model.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });
 car.add(model);
 carLoaded=true;
 document.getElementById("status").textContent="3D G63 загружен";
},undefined,error=>{
 car.add(fallbackCar());
 document.getElementById("status").textContent=
 "Используется демонстрационная модель. Добавь g63.glb для настоящего автомобиля.";
});

// Headlights
for(const x of [-.85,.85]){
 const light=new THREE.SpotLight(0xdceeff,100,55,.35,.5,1);
 light.position.set(x,1.5,1.5);
 light.target.position.set(x,.2,-30);
 car.add(light);
 car.add(light.target);
}

// Controls
const keys={};
let speed=0,distance=0,steering=0,playing=false;

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>
  el.addEventListener(ev,()=>keys[key]=false)
 );
}
bind("left","a");
bind("right","d");
bind("gas","w");
bind("brake","s");

window.startGame=()=>{
 playing=true;
 document.getElementById("menu").style.display="none";
};

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  if(keys.w)speed+=35*dt;
  else speed-=12*dt;
  if(keys.s)speed-=65*dt;
  speed=THREE.MathUtils.clamp(speed,0,240);

  if(keys.a)steering+=2.2*dt;
  if(keys.d)steering-=2.2*dt;
  if(!keys.a&&!keys.d)steering*=.92;

  car.position.x+=steering*speed*.012*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-5.8,5.8);

  car.rotation.y=THREE.MathUtils.lerp(
   car.rotation.y,-steering*.25,.08
  );

  distance+=speed*dt/3.6;
  document.getElementById("speed").textContent=Math.round(speed);
  document.getElementById("distance").textContent=Math.floor(distance);
 }

 // Moving road and city
 const movement=speed*dt/3.6;
 for(const b of buildings){
  b.position.z+=movement;
  if(b.position.z>25)b.position.z-=285;
 }
 for(const child of scene.children){
  if(child.userData.moving){
   child.position.z+=movement;
   if(child.position.z>25)child.position.z-=285;
  }
 }

 // Camera follow
 const target=new THREE.Vector3(
  car.position.x*.45,4.2,10
 );
 camera.position.lerp(target,.06);
 camera.lookAt(car.position.x*.35,1,-12);

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
